<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Sign in — Vibrant</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body data-page="login">
    <header>
      <a class="logo" href="index.html">✳ Vibrant<span>.</span></a><a class="button outline" href="events.html">Explore events</a>
    </header>
    <main class="container narrow">
      <form class="box" id="login">
        <h1>
          Welcome to Vibrant
        </h1>
        <p>
          Sign in to continue to your Organizer or Attendee account.
        </p>
        <label>
          Email
          <input required type="email" name="email">
        </label>
        <label>
          Password
          <input required type="password" name="password">
        </label>
        <button class="button full">Continue</button>
        <p>
          New here? <a class="text-button" href="register.html">Create an account</a>
        </p>
        <small>Sign in with the account type you selected when you registered.</small>
      </form>
    </main>
    <script src="app.js">
    </script>
    <script src="backend.js?v=20261005-role-nav2">
    </script>
  </body>
</html>
